name: Daily Stats Snapshot

on:
  schedule:
    - cron: '0 11 * * *'  # 11am UTC = 7am EDT daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests duckdb==1.4.4

      - name: Run daily refresh (lifetime + 7d + 30d + weekly stats)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
          EPIC_CLIENT_ID: ${{ secrets.EPIC_CLIENT_ID }}
          EPIC_CLIENT_SECRET: ${{ secrets.EPIC_CLIENT_SECRET }}
          EPIC_DEVICE_ACCOUNT_ID: ${{ secrets.EPIC_DEVICE_ACCOUNT_ID }}
          EPIC_DEVICE_ID: ${{ secrets.EPIC_DEVICE_ID }}
          EPIC_DEVICE_SECRET: ${{ secrets.EPIC_DEVICE_SECRET }}
        run: python snapshot.py
